<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.5" fill="#141414" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="1240" height="1754" fill="#f7e8c3"/>
  <rect x="40" y="0" width="1160" height="200" fill="url(#dots)" opacity="0.5"/>
  <rect x="18" y="18" width="1204" height="1718" fill="none" stroke="#141414" stroke-width="8"/>
  <text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900" fill="#141414">RAMP PHYSICS r2</text>
  <text x="60" y="215" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#141414">GUÍA DE ESTILO VISUAL · OPCIÓN C — CÓMIC</text>
  <line x1="60" y1="245" x2="1180" y2="245" stroke="#141414" stroke-width="5"/>

  <text x="60" y="315" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#141414">PALETA — CADA COLOR TIENE UN ROL DE JUEGO</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g><rect x="60" y="345" width="140" height="78" fill="#f7e8c3" stroke="#141414" stroke-width="5"/><text x="220" y="380" font-size="34" font-weight="700" fill="#141414">Papel crema  #f7e8c3</text><text x="220" y="415" font-size="29" fill="#3c3c3c">Fondo de todas las pantallas</text></g>
    <g><rect x="60" y="437" width="140" height="78" fill="#141414" stroke="#141414" stroke-width="5"/><text x="220" y="472" font-size="34" font-weight="700" fill="#141414">Tinta negra  #141414</text><text x="220" y="507" font-size="29" fill="#3c3c3c">Contornos gruesos, texto, HUD</text></g>
    <g><rect x="60" y="529" width="140" height="78" fill="#ffc93c" stroke="#141414" stroke-width="5"/><text x="220" y="564" font-size="34" font-weight="700" fill="#141414">Amarillo sol  #ffc93c</text><text x="220" y="599" font-size="29" fill="#3c3c3c">PROTAGONISTA: muñeco, LEVEL</text></g>
    <g><rect x="60" y="621" width="140" height="78" fill="#1e3a5f" stroke="#141414" stroke-width="5"/><text x="220" y="656" font-size="34" font-weight="700" fill="#141414">Azul marino  #1e3a5f</text><text x="220" y="691" font-size="29" fill="#3c3c3c">Rampas de acero, plataformas</text></g>
    <g><rect x="60" y="713" width="140" height="78" fill="#ff4757" stroke="#141414" stroke-width="5"/><text x="220" y="748" font-size="34" font-weight="700" fill="#141414">Rojo coral  #ff4757</text><text x="220" y="783" font-size="29" fill="#3c3c3c">PELIGRO: dinamita, avisos</text></g>
    <g><rect x="60" y="805" width="140" height="78" fill="#ff7f2a" stroke="#141414" stroke-width="5"/><text x="220" y="840" font-size="34" font-weight="700" fill="#141414">Naranja  #ff7f2a</text><text x="220" y="875" font-size="29" fill="#3c3c3c">Peligro: mecha, explosión</text></g>
    <g><rect x="60" y="897" width="140" height="78" fill="#2ed573" stroke="#141414" stroke-width="5"/><text x="220" y="932" font-size="34" font-weight="700" fill="#141414">Verde  #2ed573</text><text x="220" y="967" font-size="29" fill="#3c3c3c">META: bandera, LAUNCH!</text></g>
    <g><rect x="60" y="989" width="140" height="78" fill="#ffd700" stroke="#141414" stroke-width="5"/><text x="220" y="1024" font-size="34" font-weight="700" fill="#141414">Dorado  #ffd700</text><text x="220" y="1059" font-size="29" fill="#3c3c3c">MONEDAS: siempre dorado</text></g>
