    <rect x="60" y="1175" width="330" height="76" rx="38" fill="#1e3a5f" stroke="#141414" stroke-width="5"/><text x="84" y="1225" fill="#ffffff">STEEL</text>
    <rect x="430" y="1175" width="330" height="76" rx="38" fill="#4a90d9" stroke="#141414" stroke-width="5"/><text x="454" y="1225" fill="#ffffff">BOUNCY</text>
    <rect x="800" y="1175" width="330" height="76" rx="38" fill="#2ed573" stroke="#141414" stroke-width="5"/><text x="824" y="1225" fill="#ffffff">BOOST</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#3c3c3c">
    <text x="84" y="1290">rápida, resbala poco</text>
    <text x="454" y="1290">rebota (rest. 0.9)</text>
    <text x="824" y="1290">desliza en pendientes suaves</text>
  </g>

  <text x="60" y="1380" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#141414">TIPOGRAFÍA</text>
  <text x="60" y="1445" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#141414">Lilita One — títulos y números</text>
  <text x="60" y="1500" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#3c3c3c">Nunito — texto y pistas</text>

  <text x="60" y="1590" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#141414">ELEMENTOS — LECTURA INMEDIATA</text>
  <text x="60" y="1645" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#3c3c3c">Muñeco amarillo con visor · Rampa azul con rayas cruzadas · Ventilador con remolinos</text>
  <text x="60" y="1690" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#3c3c3c">Dinamita roja «TNT» · Bandera a cuadros con destellos · Moneda dorada con brillo</text>
